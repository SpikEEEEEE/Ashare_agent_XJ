[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-agent-xj"
version = "0.1.0"
description = "Extensible stock selection and AI portfolio advisory service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.3.0,<3.0.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.1.0,<3.0",
  "lightgbm>=4.0,<5.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "PyYAML>=6.0,<7.0",
  "tushare>=1.4.21,<2.0.0",
  "openai>=1.64.0,<3.0.0",
  "langgraph>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0,<9.0",
  "httpx>=0.27.0,<1.0.0",
  "streamlit>=1.40.0,<2.0.0",
]
frontend = [
  "streamlit>=1.40.0,<2.0.0",
]

[project.scripts]
ashare-agent = "ashare_agent.cli:main"
ashare-select = "ashare_agent.selection.cli:main"
ashare-backtest = "ashare_agent.backtest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ashare_agent*"]

[tool.setuptools.package-data]
ashare_agent = ["resources/*.yaml", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
